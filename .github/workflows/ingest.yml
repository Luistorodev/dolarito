# Ingest — one capture cycle every 15 minutes (T018).
#
# The cadence is the project's, not any source's: every provider we poll
# refreshes faster than this (see the table in packages/ingest/src/http.ts).
# Fifteen minutes is the conservative side of Article V.3 by a wide margin.
#
# There is no build step. packages/ingest runs TypeScript directly through
# Node's native type stripping, which is why nothing is compiled here.
name: ingest

on:
  schedule:
    # Every 15 minutes, deliberately NOT on :00/:15/:30/:45.
    #
    # The interval is unchanged; only the phase is. Round minutes are the most
    # contended slots on the platform, and GitHub queues rather than guarantees
    # a schedule — it skips runs under load. Moving off them is the cheap half
    # of the hypothesis in plan.md §1.2, which also carries the decision rule
    # for when to stop waiting and migrate to pg_cron.
    #
    # It is a hypothesis, not a confirmed cause. The silence alarm (T019) is
    # what actually notices when this fails, rather than trusting the cron.
    - cron: '7,22,37,52 * * * *'
  # Manual trigger, for the first run and for debugging without waiting.
  # Also the entry point pg_cron uses: it dispatches this workflow rather than
  # running the ingest itself, so the work stays on the runtime the tests
  # exercise and the logs stay here.
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Who asked for this run'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - pg_cron

# A late run must never overlap the next one: two cycles writing at once would
# collide on the unique index of `quotes`, and the second would fail for a
# reason that has nothing to do with any source.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # One cycle takes about 35 seconds against live sources. Ten minutes is
    # room for a slow source plus the backoff, and still far below the next
    # scheduled run.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # pnpm goes BEFORE setup-node, deliberately.
      #
      # setup-node@v5 probes the environment for package managers as it
      # finishes. On a runner where pnpm does not exist yet that probe is a
      # hard error rather than a warning, and the job dies in 8 seconds
      # without reaching a single source. That is exactly what happened on
      # the first scheduled run after the @v4 -> @v5 bump (460db1a): the
      # green manual run before it had never executed this version.
      #
      # The pnpm version is deliberately NOT restated here: action-setup
      # reads the `packageManager` field of package.json, so there is one
      # source of truth for it and no second place to drift.
      #
      # This also replaces `corepack enable`: with action-setup providing
      # pnpm, corepack shims on top would only add a way for the two to
      # disagree about which pnpm runs.
      #
      # @v6 since 2026-09-15, and only after it had actually run. v4 emits a
      # Node 20 deprecation warning; v6 runs on node24 with inputs identical
      # to v4. That similarity is what the @v5 setup-node bump also had, and
      # it cost a day — so the bump went to verify.yml alone first and sat
      # there until it was seen green on both branches (verify #3 on
      # 001-dolarito, #4 on main, over 10623fb). A failure here costs the
      # T020 window; a failure there cost a red tick.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run one capture cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Writes only. It never reaches a browser bundle (plan.md §2.3).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Article V.4: identifiable, with a way to reach us. http.ts refuses
          # to send a request without it, so a missing secret fails loudly here
          # rather than quietly presenting no identity to eight providers.
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
          # Which route opened this run, landing in runs.trigger_src.
          #
          # `github_schedule` appears ONLY when GitHub's own scheduler fires,
          # so while both routes are live this is what tells us whether that
          # scheduler came back on its own — measured, not guessed.
          #
          # A value db.ts does not recognise is dropped rather than sent, so a
          # typo here cannot fail every insert (Art. II).
          INGEST_TRIGGER: ${{ github.event_name == 'schedule' && 'github_schedule' || inputs.trigger }}
        run: pnpm --filter @dolarito/ingest run ingest
