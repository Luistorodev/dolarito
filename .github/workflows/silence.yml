# Silence alarm — once a day (T019).
#
# The real failure mode here is not a crash but an adapter that quietly returns
# stale data for weeks (Art. VI). Nothing else in the system notices that, so
# something has to go looking.
#
# It also keeps the repository active, which is what stops Actions disabling the
# ingest cron for inactivity (plan.md §5).
name: silence

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Look for silence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
        run: pnpm --filter @dolarito/ingest run check:silence
