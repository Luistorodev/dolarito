# Silence alarm — once a day (T019).
#
# The real failure mode here is not a crash but an adapter that quietly returns
# stale data for weeks (Art. VI). Nothing else in the system notices that, so
# something has to go looking.
#
# It also keeps the repository active, which is what stops Actions disabling the
# ingest cron for inactivity (plan.md §5).
name: silence

on:
  schedule:
    # Daily, deliberately off the top of the hour: :00 is the most contended
    # slot on the platform. Same reasoning as ingest.yml and plan.md §1.2.
    - cron: '38 13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      # pnpm goes BEFORE setup-node, deliberately.
      #
      # setup-node@v5 probes the environment for package managers as it
      # finishes. On a runner where pnpm does not exist yet that probe is a
      # hard error rather than a warning, and the job dies in 8 seconds
      # without reaching a single source. That is exactly what happened on
      # the first scheduled run after the @v4 -> @v5 bump (460db1a): the
      # green manual run before it had never executed this version.
      #
      # The pnpm version is deliberately NOT restated here: action-setup
      # reads the `packageManager` field of package.json, so there is one
      # source of truth for it and no second place to drift.
      #
      # This also replaces `corepack enable`: with action-setup providing
      # pnpm, corepack shims on top would only add a way for the two to
      # disagree about which pnpm runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Runs after the silence check, and with if:always() so a damaged
      # document cannot mask a real outage — nor the other way round. Here
      # because this is already the guard workflow, and because a truncated
      # governance file that nobody notices costs the next session its whole
      # context (see CLAUDE.md, "Escribir archivos desde el shell").
      - name: Check the governance documents are intact
        if: always()
        run: pnpm --filter @dolarito/ingest run check:docs

      - name: Look for silence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
        run: pnpm --filter @dolarito/ingest run check:silence
